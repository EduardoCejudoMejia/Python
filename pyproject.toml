[project]
name = "python"
version = "0.1.0"
description = ""
authors = [
    { name = "Eduardo Cejudo", email = "eduardo_cejudo@outlook.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx (>=0.28.1,<0.29.0)", "sqlalchemy (>=2.0.52,<3.0.0)", "fastapi (>=0.141.1,<0.142.0)", "uvicorn[standard] (>=0.52.1,<0.53.0)", "pandas (>=2.2.0,<3.0.0)", "scikit-learn (>=1.5.0,<2.0.0)", "joblib (>=1.4.0,<2.0.0)"]

[tool.poetry]
packages = [{ include = "python", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "hypothesis (>=6.0.0,<7.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

# ----------------------------
# Black
# ----------------------------
[tool.black]
line-length = 88
target-version = ["py312"]

# ----------------------------
# Ruff
# ----------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # Ordenar imports (reemplaza isort)
    "B",
    "UP"
]

# Opcional: reglas que puedes ignorar
ignore = []

# FastAPI declara formularios e inyección de dependencias mediante defaults.
[tool.ruff.lint.per-file-ignores]
"src/app/JWT.py" = ["B008"]
"src/app/lab_api_cars/routers/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ----------------------------
# Pytest
# ----------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "propiedades: pruebas basadas en propiedades con Hypothesis"
]

[tool.coverage.run]
branch = true
source = ["app.lab_tdd_cars"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
strict = true
